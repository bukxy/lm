x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  php:
    build: .
    container_name: lordmobile_php73
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
    logging: *default-logging

  nginx:
    image: nginx:1.25-alpine
    container_name: lordmobile_nginx
    ports:
      - "8080:80"
    volumes:
      - ./:/var/www/html
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - php
    logging: *default-logging

  mysql:
    image: mysql:5.7
    container_name: lordmobile_mysql57
    command: --default-authentication-plugin=mysql_native_password
    env_file:
      - docker.env
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    logging: *default-logging

volumes:
  mysql_data:
