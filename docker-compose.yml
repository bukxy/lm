services:
  php:
    build: .
    container_name: lordmobile_php73
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
    environment:
      APP_ENV: prod

  nginx:
    image: nginx:1.25-alpine
    container_name: lordmobile_nginx
    ports:
      - "8080:80"
    volumes:
      - ./:/var/www/html
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - php

  mysql:
    image: mysql:5.7
    container_name: lordmobile_mysql57
    command: --default-authentication-plugin=mysql_native_password
    environment:
      MYSQL_DATABASE: lordmobile
      MYSQL_USER: gdeiXMPxYJfha8dC
      MYSQL_PASSWORD: qpxsCSH8KYt6hxqh
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data:
